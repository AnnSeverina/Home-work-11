<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homework 11</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/modern-normalize@3.0.1/modern-normalize.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/styles.css" />
  </head>
  <body>
    <header>
      <div class="container">
        <a href="./index.html" class="logo">Dudeshape</a>
        <nav>
          <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Products</a></li>
            <li><a href="#">About Us</a></li>
            <li><a href="#">Contact Us</a></li>
          </ul>
        </nav>
        <ul class="external-links">
          <li>
            <a href="#">
              <svg>
                <use href="./images/sprite.svg#icon-user"></use>
              </svg>
            </a>
          </li>
          <li>
            <a href="#">
              <svg>
                <use href="./images/sprite.svg#icon-cart"></use></svg
            ></a>
          </li>
          <li>
            <a href="#">
              <svg>
                <use href="./images/sprite.svg#icon-list"></use></svg
            ></a>
          </li>
        </ul>
      </div>
    </header>
    <main>
      <section class="hero">
        <div class="container">
          <h1>Get Your Best Cosmetic Products Here</h1>
          <p>
            Lorem Ipsum is simply dummy text of the printing and typesetting
            industry. Lorem Ipsum has been the industry's standard dummy
          </p>
          <form class="hero-search">
            <input
              class="hero-search-input"
              type="text"
              placeholder="Search..."
              aria-label="Search products"
            />
            <button
              class="hero-search-button"
              type="submit"
              aria-label="Search"
            >
              <svg class="hero-search-icon">
                <use href="./images/sprite.svg#icon-search"></use>
              </svg>
            </button>
          </form>
          <a class="hero-shop-link" href="./index.html">Shop Now</a>
          <ul class="hero-list">
            <li>
              <button
                class="hero-arrow-button"
                type="button"
                aria-label="Previous slide"
              >
                <svg>
                  <use href="./images/sprite.svg#icon-left"></use>
                </svg>
              </button>
            </li>
            <li>
              <button
                class="hero-arrow-button"
                type="button"
                aria-label="Next slide"
              >
                <svg>
                  <use href="./images/sprite.svg#icon-right"></use>
                </svg>
              </button>
            </li>
          </ul>
        </div>
      </section>
    </main>
  </body>
</html>
